<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Color Intelligence Engine</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">
    <h1>Color Intelligence Engine</h1>
    <p class="subtitle">AI-assisted cinematic color selection</p>

    <div id="loading" class="loading-overlay">
        <div class="spinner"></div>
        <p>Generating intelligence…</p>
    </div>

    <form method="POST" onsubmit="showLoading()">
        <label>Base Color</label>
        <select name="base_color" required>
            {% for c in base_colors %}
            <option value="{{ c }}">{{ c }}</option>
            {% endfor %}
        </select>

        <label>Theme</label>
        <select name="theme" required>
            {% for t in themes %}
            <option value="{{ t }}">{{ t }}</option>
            {% endfor %}
        </select>

        <label>Top Results</label>
        <input type="number" name="top_k" value="5" min="1" max="10">

        <button type="submit">Generate</button>
    </form>

    {% if results %}
    <div class="results">
        <h2>Recommended Colors</h2>
        <ul>
            {% for r in results %}
            <li>
                <span class="color-dot"></span>
                <span class="color-name">{{ r.color }}</span>
                <span class="score">{{ r.score }}</span>
            </li>
            {% endfor %}
        </ul>
    </div>
    {% endif %}

    {% if prompt %}
    <div class="prompt-section">
        <h2>Generated Prompt</h2>
        <div class="prompt-box" id="promptText">{{ prompt }}</div>
        <button class="copy-btn" onclick="copyPrompt()">Copy Prompt</button>
    </div>
    {% endif %}
</div>

<script>
function showLoading() {
    document.getElementById("loading").style.display = "flex";
}

function copyPrompt() {
    const text = document.getElementById("promptText").innerText;
    navigator.clipboard.writeText(text);
    alert("Prompt copied to clipboard!");
}
</script>

</body>
</html>
